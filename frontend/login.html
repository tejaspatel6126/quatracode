<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to SecureAudit — AI-Powered Web Security Configuration Auditor." />
  <title>Sign In — SecureAudit</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div class="public-page">
  <div class="auth-card" role="main">

    <div class="auth-card-header">
      <div class="auth-logo" aria-hidden="true">🛡</div>
      <h1 class="auth-card-title">SecureAudit</h1>
      <p class="auth-card-subtitle">Web Security Configuration Auditor</p>
    </div>

    <div class="auth-card-body">
      <div id="login-alert" class="alert alert-error" role="alert" aria-live="polite"></div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            class="form-input"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />
          <span id="email-error" class="form-error hidden" role="alert"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-input"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />
          <span id="password-error" class="form-error hidden" role="alert"></span>
        </div>

        <button
          id="login-btn"
          type="submit"
          class="btn btn-primary btn-full btn-lg"
        >
          Sign In
        </button>
      </form>
    </div>

    <div class="auth-footer">
      New user? Contact your administrator to create an account.
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
